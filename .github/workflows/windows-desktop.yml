name: Sugio Labs Windows Desktop

on:
  push:
    branches:
      - rebuild/full-app-ui
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Stage frontend for desktop bundle
        shell: pwsh
        run: |
          if (Test-Path backend/frontend_dist) {
            Remove-Item backend/frontend_dist -Recurse -Force
          }
          Copy-Item frontend/dist backend/frontend_dist -Recurse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pywebview>=5.3,<7" "pyinstaller>=6.10,<7"

      - name: Build portable Windows app
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller desktop.py `
            --name SugioLabs `
            --windowed `
            --noconfirm `
            --clean `
            --add-data "frontend_dist;frontend_dist" `
            --collect-all webview

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\SugioLabs.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Windows-Installer
          path: installer/output/Sugio-Labs-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Windows-Portable
          path: backend/dist/SugioLabs/**
          if-no-files-found: error
          retention-days: 14
