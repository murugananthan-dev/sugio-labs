name: Sugio Labs Windows Desktop

on:
  push:
    branches:
      - rebuild/full-app-ui
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Stage frontend for local engine
        shell: pwsh
        run: |
          if (Test-Path backend/frontend_dist) {
            Remove-Item backend/frontend_dist -Recurse -Force
          }
          Copy-Item frontend/dist backend/frontend_dist -Recurse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10,<7"

      - name: Build hidden local engine
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller desktop_server.py `
            --name SugioLabsEngine `
            --onefile `
            --windowed `
            --noconfirm `
            --clean `
            --add-data "frontend_dist;frontend_dist" `
            --collect-all langchain_core `
            --collect-all langchain_community `
            --collect-all langchain_ollama `
            --collect-all langgraph `
            --collect-all ollama

      - name: Test packaged local engine
        working-directory: backend
        shell: pwsh
        run: |
          $port = 18765
          $process = Start-Process -FilePath ".\dist\SugioLabsEngine.exe" -ArgumentList "--port", "$port" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/api/v1/health" -TimeoutSec 2
                $home = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/" -TimeoutSec 2
                if ($health.StatusCode -eq 200 -and $home.StatusCode -eq 200 -and $home.Content -match "<!doctype html") {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "Packaged Sugio Labs engine did not pass its health/UI test."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Stage engine for Electron
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/engine | Out-Null
          Copy-Item backend/dist/SugioLabsEngine.exe desktop/engine/SugioLabsEngine.exe -Force

      - name: Install Electron desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows desktop software
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload Windows software
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Windows-Software
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
