name: Sugio Labs Native Windows Desktop

on:
  push:
    branches:
      - rebuild/full-app-ui
  workflow_dispatch:

jobs:
  build-native-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python backend build dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6.10,<7"

      - name: Build compulsory Python backend engine
        working-directory: backend
        shell: pwsh
        run: |
          pyinstaller ipc_engine.py `
            --name SugioLabsEngine `
            --onefile `
            --windowed `
            --noconfirm `
            --clean `
            --collect-all langchain_core `
            --collect-all langchain_community `
            --collect-all langchain_ollama `
            --collect-all langgraph `
            --collect-all ollama `
            --collect-all networkx

      - name: Test packaged Python IPC engine
        working-directory: backend
        shell: pwsh
        run: |
          @'
          import json
          import subprocess

          p = subprocess.Popen(
              [r"dist\SugioLabsEngine.exe"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
          )
          try:
              request = json.dumps({"id": "ci", "command": "ping", "payload": {}})
              p.stdin.write(request + "\n")
              p.stdin.flush()
              line = p.stdout.readline().strip()
              data = json.loads(line)
              if not data.get("ok") or data.get("result", {}).get("status") != "ok":
                  raise SystemExit(f"Unexpected IPC response: {data}")
              p.stdin.write(json.dumps({"id": "bye", "command": "shutdown", "payload": {}}) + "\n")
              p.stdin.flush()
              p.stdout.readline()
          finally:
              try:
                  p.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  p.kill()
          '@ | Set-Content -Encoding UTF8 .\test_packaged_engine.py
          python .\test_packaged_engine.py

      - name: Embed Python backend into native desktop project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/SugioLabs.Desktop/Resources | Out-Null
          Copy-Item backend/dist/SugioLabsEngine.exe native/SugioLabs.Desktop/Resources/SugioLabsEngine.exe -Force

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore native desktop project
        run: dotnet restore native/SugioLabs.Desktop/SugioLabs.Desktop.csproj

      - name: Publish single-file native EXE
        shell: pwsh
        run: |
          dotnet publish native/SugioLabs.Desktop/SugioLabs.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o native/publish

      - name: Self-test final SugioLabs.exe
        shell: pwsh
        run: |
          $env:SUGIO_SELF_TEST_LOG = "$PWD\native\self-test.log"
          $process = Start-Process `
            -FilePath ".\native\publish\SugioLabs.exe" `
            -ArgumentList "--self-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:SUGIO_SELF_TEST_LOG) {
              Write-Host "----- Sugio Labs self-test diagnostics -----"
              Get-Content $env:SUGIO_SELF_TEST_LOG
              Write-Host "-------------------------------------------"
            }
            throw "Native SugioLabs.exe self-test failed with exit code $($process.ExitCode)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\SugioLabs.iss"

      - name: Build native MSI installer
        shell: pwsh
        run: |
          dotnet build installer/msi/SugioLabs.wixproj -c Release
          New-Item -ItemType Directory -Force installer/output | Out-Null
          $msi = Get-ChildItem installer/msi/bin -Recurse -Filter "Sugio-Labs.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "WiX build completed but Sugio-Labs.msi was not found"
          }
          Copy-Item $msi.FullName installer/output/Sugio-Labs.msi -Force

      - name: Smoke-test MSI install and embedded Python backend
        shell: pwsh
        run: |
          $msi = (Resolve-Path "installer/output/Sugio-Labs.msi").Path
          $installLog = Join-Path $PWD "installer\msi-install.log"
          $uninstallLog = Join-Path $PWD "installer\msi-uninstall.log"

          Write-Host "Runner identity: $(whoami)"
          whoami /groups

          $installArgs = "/i `"$msi`" /qn /norestart /l*v `"$installLog`""
          $install = Start-Process msiexec.exe `
            -ArgumentList $installArgs `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Write-Host "----- Windows Installer verbose log -----"
            if (Test-Path $installLog) {
              Get-Content $installLog | Select-Object -Last 250
            }
            Write-Host "-----------------------------------------"
            throw "MSI install failed with exit code $($install.ExitCode)"
          }

          try {
            $installedExe = Join-Path $env:ProgramFiles "Sugio Labs\SugioLabs.exe"
            if (-not (Test-Path $installedExe)) {
              throw "MSI installed successfully but SugioLabs.exe was not found at $installedExe"
            }

            $env:SUGIO_SELF_TEST_LOG = "$PWD\native\msi-self-test.log"
            $selfTest = Start-Process `
              -FilePath $installedExe `
              -ArgumentList "--self-test" `
              -Wait `
              -PassThru
            if ($selfTest.ExitCode -ne 0) {
              if (Test-Path $env:SUGIO_SELF_TEST_LOG) {
                Get-Content $env:SUGIO_SELF_TEST_LOG
              }
              throw "MSI-installed SugioLabs.exe self-test failed with exit code $($selfTest.ExitCode)"
            }
          }
          finally {
            $uninstallArgs = "/x `"$msi`" /qn /norestart /l*v `"$uninstallLog`""
            $uninstall = Start-Process msiexec.exe `
              -ArgumentList $uninstallArgs `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) {
              if (Test-Path $uninstallLog) {
                Get-Content $uninstallLog | Select-Object -Last 250
              }
              throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
            }
          }

      - name: Upload native portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Native-EXE
          path: native/publish/SugioLabs.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload native setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Native-Installer
          path: installer/output/Sugio-Labs-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload native MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Sugio-Labs-Native-MSI
          path: installer/output/Sugio-Labs.msi
          if-no-files-found: error
          retention-days: 14
