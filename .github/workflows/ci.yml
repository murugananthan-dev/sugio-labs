name: Sugio Labs CI

on:
  push:
    branches:
      - rebuild/full-app-ui
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --extra dev
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Create full project ZIP
        run: |
          mkdir -p package/sugio-labs-full-app
          rsync -a ./ package/sugio-labs-full-app/ \
            --exclude package \
            --exclude .git \
            --exclude frontend/node_modules \
            --exclude frontend/dist \
            --exclude backend/.venv \
            --exclude backend/.pytest_cache
          cd package
          zip -r sugio-labs-full-app.zip sugio-labs-full-app
      - uses: actions/upload-artifact@v4
        with:
          name: sugio-labs-full-app
          path: package/sugio-labs-full-app.zip
          if-no-files-found: error
          retention-days: 7
