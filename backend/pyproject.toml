[project]
name = "sugio-labs-backend"
version = "0.1.0"
description = "Sugio Labs - Local, Human-Controlled AI Software Development Agent Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.30",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "httpx>=0.27.2",
    "networkx>=3.3",
    "sqlalchemy>=2.0.35",
    "python-dotenv>=1.0.1",
    "websockets>=13.1",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
# Disable LangSmith cloud pytest plugin — not needed for local-first project.
# Its xxhash C extension DLL is also blocked by Windows Application Control.
addopts = "-p no:langsmith"
